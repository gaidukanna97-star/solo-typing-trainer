<!doctype html>
<html lang="uk" data-theme="auto" data-motion="on">

  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

<body>
  <a class="skip" href="#app">Перейти до змісту</a>
  <header class="top">
    <a class="brand" href="#/" aria-label="Аметрін ФК · Соло — на головну"><img class="brand-logo" src="assets/ametrin-logo.svg" alt="Аметрін ФК" width="139" height="32"><span class="brand-name">Соло</span></a>
    <nav class="nav" aria-label="Основна навігація">
      <a href="#/">Шлях</a>
      <a href="#/guide">Посібник</a>
      <a href="#/academy">Академія</a>
      <a href="#/daily">Заняття дня</a>

  </footer>
  <div id="live" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>
